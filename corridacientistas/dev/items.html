<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste: itens e efeitos</title>
<style>
  #hud { position: fixed; left: 8px; top: 8px; color: #fff; font: 12px/1.35 monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
  #keys { position: fixed; right: 8px; top: 8px; color: #fff; font: 11px/1.4 monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; white-space: pre; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="keys">1-8: dar item ao kart seguido e usar
Tab: seguir próximo kart   P: pausa
D: drift (nível sobe)   B: turbo   F: Faraday
T: Tesla   N: confete   X: explosão</div>
<script type="module">
import * as THREE from '../js/three.js';
import { stubScene, StubKart } from './stubs.js';
import { CHARACTERS, QUALITY, ITEMS, ITEM_IDS } from '../js/config.js';
import { bus } from '../js/events.js';
import { ItemSystem } from '../js/items.js';
import { Effects } from '../js/effects.js';

const params = new URLSearchParams(location.search);
const quality = QUALITY[params.get('q') || 'alta'];
const { scene, camera, renderer, track, onFrame } = stubScene();
if (params.get('tm') !== 'none') {
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
}
scene.fog = new THREE.Fog(0x8fd3ff, 160, 650);

// contagem de eventos do bus
const counts = {};
const lastEvent = {};
const origEmit = bus.emit.bind(bus);
bus.emit = (n, d) => { counts[n] = (counts[n] || 0) + 1; lastEvent[n] = d; origEmit(n, d); };

const karts = CHARACTERS.map((c, i) => {
  const k = new StubKart({ character: c, index: i, bus, track, cruise: 26 - i * 1.3, lateral: [-4, 4, 0, -6, 6, -2, 2, 0][i], isPlayer: i === 0 });
  k.placeAt(track.gridSlots[i]);
  scene.add(k.object3d);
  return k;
});
const effects = new Effects({ scene, bus, quality });
const items = new ItemSystem({ scene, track, bus, effects, quality });
items.reset(karts);
const world = { scene, camera, renderer, track, karts, player: karts[0], items, effects, bus, time: 0, phase: 'racing', quality, cc: null, totalLaps: 3 };

// progresso para calcular posições
const prog = karts.map((k, i) => -(8 + i * 5));
const lastS = karts.map((k) => k.s);
let manualPlaces = null;
function computePlaces() {
  karts.forEach((k, i) => {
    let d = k.s - lastS[i];
    if (d < -track.length / 2) d += track.length;
    if (d > track.length / 2) d -= track.length;
    prog[i] += d;
    lastS[i] = k.s;
  });
  if (manualPlaces) { karts.forEach((k, i) => (k.place = manualPlaces[i])); return; }
  const order = karts.map((k, i) => i).sort((a, b) => prog[b] - prog[a]);
  order.forEach((idx, p) => (karts[idx].place = p + 1));
}

// câmera
let cam = { mode: 'follow', i: 0, back: 7, up: 3, ahead: 6, side: 0 };
const _f = new THREE.Vector3(), _r = new THREE.Vector3(), _t = new THREE.Vector3();
function updateCam() {
  if (cam.mode === 'fixed') { camera.position.copy(cam.pos); camera.lookAt(cam.target); return; }
  const k = karts[cam.i];
  if (cam.mode === 'watch') {
    const w = cam.watch();
    if (w) { camera.position.copy(cam.pos); camera.lookAt(w); }
    return;
  }
  _f.set(Math.sin(k.heading), 0, Math.cos(k.heading));
  _r.set(-_f.z, 0, _f.x);
  camera.position.copy(k.position).addScaledVector(_f, -cam.back).addScaledVector(_r, cam.side).add(_t.set(0, cam.up, 0));
  _t.copy(k.position).addScaledVector(_f, cam.ahead).add(new THREE.Vector3(0, 1, 0));
  camera.lookAt(_t);
}

let paused = false;
function sim(dt) {
  for (const k of karts) k.update(dt);
  computePlaces();
  world.time += dt;
  items.update(dt, world);
  effects.update(dt, world);
}
const hud = document.getElementById('hud');
let frame = 0;
onFrame((dt) => {
  if (!paused) sim(dt);
  updateCam();
  if (frame++ % 10 === 0) {
    hud.textContent = karts.map((k) => `${k.place} ${k.character.name.padEnd(13)} ${(k.item || (k.roulette ? '[' + k.roulette.showing + ']' : '-')).padEnd(10)} x${k.itemCount}` +
      (k.spinTime > 0 ? ' GIRO' : '') + (k.tumbleTime > 0 ? ' CAPOTE' : '') + (k.shrinkTime > 0 ? ' MINI' : '') + (k.starTime > 0 ? ' GAIOLA' : '')).join('\n') +
      `\nperigos: ${items.hazards.length}  partículas: ${effects.add.n}+${effects.alpha.n}  draw calls: ${renderer.info.render.calls}`;
  }
});

const kp = (i) => karts[i].position;
window.test = {
  world, items, effects, karts, track, counts, lastEvent, bus, THREE,
  pause(b = true) { paused = b; return paused; },
  step(sec, dt = 1 / 60) { const n = Math.round(sec / dt); for (let i = 0; i < n; i++) sim(dt); updateCam(); return n; },
  give(i, id) { items.giveItem(karts[i], id); return karts[i].item; },
  use(i, id) { if (id) items.giveItem(karts[i], id); karts[i].controls.useItem = true; return true; },
  follow(i, back = 7, up = 3, ahead = 6, side = 0) { cam = { mode: 'follow', i, back, up, ahead, side }; updateCam(); return i; },
  cam(px, py, pz, tx, ty, tz) { cam = { mode: 'fixed', pos: new THREE.Vector3(px, py, pz), target: new THREE.Vector3(tx, ty, tz) }; updateCam(); },
  camAt(i, dx, dy, dz, lookUp = 1) {
    // câmera fixa relativa ao kart i (no referencial dele: dx direita, dz frente)
    const k = karts[i];
    _f.set(Math.sin(k.heading), 0, Math.cos(k.heading)); _r.set(-_f.z, 0, _f.x);
    const pos = k.position.clone().addScaledVector(_r, dx).addScaledVector(_f, dz).add(new THREE.Vector3(0, dy, 0));
    cam = { mode: 'fixed', pos, target: k.position.clone().add(new THREE.Vector3(0, lookUp, 0)) }; updateCam();
  },
  watch(fn, pos) { cam = { mode: 'watch', watch: fn, pos: pos.clone() }; updateCam(); },
  places(arr) { manualPlaces = arr; if (arr) karts.forEach((k, i) => (k.place = arr[i])); return karts.map((k) => k.place); },
  drift(i, level = 1, dir = 1) { const k = karts[i]; k.drifting = level >= 0; k.driftLevel = Math.max(0, level); k.driftDir = dir; return k.drifting; },
  boost(i, t = 1.5) { karts[i].applyBoost(t, 1, 'item'); },
  state(i) { const k = karts[i]; return { place: k.place, item: k.item, n: k.itemCount, roul: !!k.roulette, spin: +k.spinTime.toFixed(2), tumble: +k.tumbleTime.toFixed(2), shrink: +k.shrinkTime.toFixed(2), star: +k.starTime.toFixed(2), boost: +k.boostTime.toFixed(2) }; },
  states() { return karts.map((k, i) => this.state(i)); },
  hazards() { return items.hazards.map((h) => `${h.type}@${h.s.toFixed(0)}`); },
  rolls(place, n = 10000) {
    const c = {};
    for (let i = 0; i < n; i++) { const id = items.pickItem(place); c[id] = (c[id] || 0) + 1; }
    return c;
  },
  expected(place) {
    const w = ITEM_IDS.map((id) => ITEMS[id].weights[place - 1]); const tot = w.reduce((a, b) => a + b, 0);
    return Object.fromEntries(ITEM_IDS.map((id, j) => [id, Math.round((w[j] / tot) * 10000)]));
  },
  finish(i = 0) { bus.emit('race:finish', { kart: karts[i], place: 1, time: 83.2 }); },
  burst(type, i = 0, opts = {}) { effects.burst(type, kp(i).clone().add(new THREE.Vector3(0, 1, 0)), opts); },
  offroad(i, on = true) { const k = karts[i]; k.offroad = on; k.lateral = on ? 12 : 0; },
  speed(i, v) { karts[i].cruise = v; },
  lateral(i, v) { karts[i].lateral = v; },
  reset() { items.reset(karts); effects.reset(); },
  nearestBox(i) { const k = karts[i]; let best = null; for (const b of items.boxes) { const d = b.pos.distanceTo(k.position); if (!best || d < best.d) best = { d, s: b.s, alive: b.alive }; } return best; },
};

// teclado para teste manual
let follow = 0;
addEventListener('keydown', (ev) => {
  const k = karts[follow];
  if (ev.key >= '1' && ev.key <= '8') test.use(follow, ITEM_IDS[+ev.key - 1]);
  else if (ev.key === 'Tab') { ev.preventDefault(); follow = (follow + 1) % 8; test.follow(follow); }
  else if (ev.key === 'p') paused = !paused;
  else if (ev.key === 'd') { if (!k.drifting) test.drift(follow, 0); else if (k.driftLevel < 3) k.driftLevel++; else k.drifting = false; }
  else if (ev.key === 'b') test.boost(follow);
  else if (ev.key === 'f') test.use(follow, 'faraday');
  else if (ev.key === 't') test.use(follow, 'tesla');
  else if (ev.key === 'n') test.finish(follow);
  else if (ev.key === 'x') test.burst('explosion', follow);
});
window.ready = true;
</script>
</body>
</html>
