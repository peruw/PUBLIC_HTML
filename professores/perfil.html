<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil do professor — Professores | Quanta Aulas</title>
  <meta name="description" content="Perfil de professor particular no Quanta Aulas: matérias, preço, modalidades e avaliações de alunos." />

  <!-- og:url, canonical e JSON-LD são definidos por perfil.js com a URL /professores/p/<slug> -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Perfil do professor — Quanta Aulas" />
  <meta property="og:description" content="Perfil de professor particular no Quanta Aulas: matérias, preço, modalidades e avaliações de alunos." />
  <meta property="og:image" content="https://quantaaulas.com/assets/preview.jpg" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Quanta Aulas" />

  <link rel="icon" type="image/png" href="/assets/logo-quanta.png" />
  <link rel="apple-touch-icon" href="/assets/logo-quanta.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/professores/css/professores.css" />
</head>

<body>
  <div class="bg-ambient"></div>
  <div class="bg-grid"></div>

  <!-- @include professores/partials/nav.html -->

  <main id="app" class="pf-main" data-page="perfil">
    <section class="pf-page pf-profile-page">
      <!-- Conteúdo montado por /professores/js/pages/perfil.js -->
      <div id="perfilRoot" class="container">
        <header class="pf-page-head">
          <div class="eyebrow">Professor particular</div>
          <h1 class="pf-title">Perfil do professor</h1>
        </header>

        <div id="pageBody" class="pf-page-body">
          <div class="pf-profile-loading" role="status">
            <span class="pf-sr-only">Carregando perfil…</span>
            <div class="pf-profile-skel" aria-hidden="true">
              <span class="pf-skel pf-profile-skel-avatar"></span>
              <div class="pf-skel-lines">
                <span class="pf-skel pf-skel-line" style="width:55%;height:22px"></span>
                <span class="pf-skel pf-skel-line" style="width:85%"></span>
                <span class="pf-skel pf-skel-line" style="width:40%"></span>
              </div>
            </div>
            <noscript><p class="pf-muted">Ative o JavaScript para ver o perfil do professor.</p></noscript>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- @include professores/partials/footer.html -->

  <script type="module" src="/professores/js/pages/perfil.js"></script>
</body>
</html>
